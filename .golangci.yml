version: "2"
linters:
  default: standard
  enable:
    - gosec
    - bodyclose
    - errorlint
    - misspell
    - noctx
  settings:
    gosec:
      excludes:
        - G104 # handled by errcheck
        - G304 # file paths come from validated node config
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, errcheck]
