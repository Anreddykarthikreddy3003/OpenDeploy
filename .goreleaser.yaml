# OpenDeploy release build (PRD §18.2): reproducible static binaries, one
# archive per platform in the slot layout (bin/...), SBOMs, checksums signed
# keylessly with cosign, SLSA provenance (release workflow) and TUF
# publication for node updates.
version: 2
project_name: opendeploy

before:
  hooks:
    - go mod download
    - sh -c 'cd web && npm ci && npm run build'

builds:
  # The first entry carries the shared settings; the rest merge them.
  - &common
    id: platformd
    main: ./cmd/platformd
    binary: bin/platformd
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -buildid=
      - -X github.com/anreddykarthikreddy3003/opendeploy/internal/daemon.Version={{ .Version }}
      - -X github.com/anreddykarthikreddy3003/opendeploy/internal/cli.Version={{ .Version }}
      - -X main.version={{ .Version }}
  - {<<: *common, id: auditd, main: ./cmd/auditd, binary: bin/auditd, goos: [linux], goarch: [amd64, arm64]}
  - {<<: *common, id: secretd, main: ./cmd/secretd, binary: bin/secretd, goos: [linux], goarch: [amd64, arm64]}
  - {<<: *common, id: artifactd, main: ./cmd/artifactd, binary: bin/artifactd, goos: [linux], goarch: [amd64, arm64]}
  - {<<: *common, id: builderd, main: ./cmd/builderd, binary: bin/builderd, goos: [linux], goarch: [amd64, arm64]}
  - {<<: *common, id: runtimed, main: ./cmd/runtimed, binary: bin/runtimed, goos: [linux], goarch: [amd64, arm64]}
  - {<<: *common, id: routemgr, main: ./cmd/routemgr, binary: bin/routemgr, goos: [linux], goarch: [amd64, arm64]}
  - {<<: *common, id: egressd, main: ./cmd/egressd, binary: bin/egressd, goos: [linux], goarch: [amd64, arm64]}
  - {<<: *common, id: relay-agent, main: ./cmd/relay-agent, binary: bin/relay-agent, goos: [linux], goarch: [amd64, arm64]}
  - {<<: *common, id: opendeploy-hostd, main: ./cmd/opendeploy-hostd, binary: bin/opendeploy-hostd, goos: [linux], goarch: [amd64, arm64]}
  - {<<: *common, id: opendeployctl-node, main: ./cmd/opendeployctl, binary: bin/opendeployctl, goos: [linux], goarch: [amd64, arm64]}
  - {<<: *common, id: opendeployctl, main: ./cmd/opendeployctl, binary: bin/opendeployctl, goos: [linux, darwin, windows], goarch: [amd64, arm64]}
  - {<<: *common, id: relay-server, main: ./relay-server/cmd/relay-server, binary: bin/relay-server, goos: [linux], goarch: [amd64, arm64]}

archives:
  # Node release: everything a slot needs (hostd stages exactly this).
  - id: node
    ids: [platformd, auditd, secretd, artifactd, builderd, runtimed, routemgr, egressd, relay-agent, opendeploy-hostd, opendeployctl-node]
    formats: [tar.gz]
    name_template: "opendeploy_{{ .Version }}_{{ .Os }}-{{ .Arch }}"
    files: [LICENSE*, README.md, packaging/linux/install.sh, packaging/linux/**/*]
  - id: cli
    ids: [opendeployctl]
    formats: [tar.gz]
    format_overrides: [{goos: windows, formats: [zip]}]
    name_template: "opendeployctl_{{ .Version }}_{{ .Os }}-{{ .Arch }}"
  - id: relay
    ids: [relay-server]
    formats: [tar.gz]
    name_template: "opendeploy-relay_{{ .Version }}_{{ .Os }}-{{ .Arch }}"

nfpms:
  # deb/rpm carry the same node payload under /usr/lib/opendeploy/release;
  # the maintainer script runs packaging/linux/install.sh, which stages it
  # into an A/B slot (never downgrading a newer release applied by the
  # verified updater) and starts opendeploy.target.
  - id: node
    package_name: opendeploy
    ids: [platformd, auditd, secretd, artifactd, builderd, runtimed, routemgr, egressd, relay-agent, opendeploy-hostd, opendeployctl-node]
    formats: [deb, rpm]
    bindir: /usr/lib/opendeploy/release
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}-{{ .Arch }}"
    vendor: OpenDeploy
    homepage: https://github.com/anreddykarthikreddy3003/opendeploy
    maintainer: anreddykarthikreddy3003 <anreddykarthikreddy3003@users.noreply.github.com>
    description: Local-first, security-hardened deployment platform (control plane, builders, runtime, router).
    section: admin
    priority: optional
    dependencies: [systemd, nftables, curl]
    recommends: [containerd, uidmap]
    suggests: [runsc]
    contents:
      - src: packaging/linux
        dst: /usr/lib/opendeploy/release/packaging/linux
        type: tree
      - src: README.md
        dst: /usr/share/doc/opendeploy/README.md
    scripts:
      postinstall: packaging/linux/nfpm/postinstall.sh
      preremove: packaging/linux/nfpm/preremove.sh
    overrides:
      rpm:
        dependencies: [systemd, nftables, curl, shadow-utils]
        recommends: [containerd]

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  draft: true
  prerelease: auto
