# OpenDeploy state directories: private per service, shared exchange
# directories group-owned with setgid so new files keep the group.
d /var/lib/opendeploy                 0755 root          root         -
d /var/lib/opendeploy/platformd       0700 od-platformd  od-platformd -
d /var/lib/opendeploy/auditd          0700 od-auditd     od-auditd    -
d /var/lib/opendeploy/secretd         0700 od-secretd    od-secretd   -
d /var/lib/opendeploy/artifactd       0750 od-artifactd  od-caddy     -
d /var/lib/opendeploy/builderd        0700 od-builderd   od-builderd  -
d /var/lib/opendeploy/build           0700 od-builderd   od-builderd  -
d /var/lib/opendeploy/build-cache     0700 od-builderd   od-builderd  -
d /var/lib/opendeploy/runtimed        0700 od-runtimed   od-runtimed  -
d /var/lib/opendeploy/volumes         0711 od-runtimed   od-runtimed  -
d /var/lib/opendeploy/routemgr        0700 od-routemgr   od-routemgr  -
d /var/lib/opendeploy/egressd         0700 od-egressd    od-egressd   -
d /var/lib/opendeploy/relay-agent     0700 od-relay-agent od-relay-agent -
d /var/lib/opendeploy/caddy           0700 od-caddy      od-caddy     -
d /var/lib/opendeploy/buildkit        0700 od-buildkit   od-buildkit  -
d /var/lib/opendeploy/hostd           0700 root          root         -
d /var/lib/opendeploy/backups         0700 od-platformd  od-platformd -
d /var/lib/opendeploy/support         0750 root          od-platformd -
d /var/lib/opendeploy/backup-staging  2770 od-platformd  od-backup    -
d /var/lib/opendeploy/handoff         2770 od-artifactd  od-handoff   -
d /var/lib/opendeploy/sources         2770 od-platformd  od-sources   -
# Service sockets: setgid (inherit od-ipc) + sticky (no cross-deletion).
d /run/opendeploy                     3770 root          od-ipc       -
# Caddy admin socket: reachable by routemgr only (member of od-caddy).
d /run/opendeploy/caddy               2750 od-caddy      od-caddy     -
d /run/opendeploy/buildkit            2750 od-buildkit   od-buildkit  -
# Fix ownership after an offline restore (opendeployctl restore).
Z /var/lib/opendeploy/platformd       -    od-platformd  od-platformd -
Z /var/lib/opendeploy/auditd          -    od-auditd     od-auditd    -
Z /var/lib/opendeploy/secretd         -    od-secretd    od-secretd   -
Z /var/lib/opendeploy/artifactd       -    od-artifactd  od-caddy     -
z /var/lib/opendeploy/volumes         -    od-runtimed   od-runtimed  -
