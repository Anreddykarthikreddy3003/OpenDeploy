# OpenDeploy service identities (PRD SC-10): one unprivileged user per
# Tier-0 service. hostd runs as root. Shared groups grant only the specific
# file/socket access listed next to them.
g od-ipc      -   -  # may connect to service sockets (peer UID still checked per operation)
g od-backup   -   -  # backup staging exchange
g od-handoff  -   -  # builderd -> artifactd artifact hand-off
g od-sources  -   -  # platformd uploads -> builderd
u od-platformd  - "OpenDeploy platformd"   /var/lib/opendeploy/platformd  -
u od-auditd     - "OpenDeploy auditd"      /var/lib/opendeploy/auditd     -
u od-secretd    - "OpenDeploy secretd"     /var/lib/opendeploy/secretd    -
u od-artifactd  - "OpenDeploy artifactd"   /var/lib/opendeploy/artifactd  -
u od-builderd   - "OpenDeploy builderd"    /var/lib/opendeploy/builderd   -
u od-runtimed   - "OpenDeploy runtimed"    /var/lib/opendeploy/runtimed   -
u od-routemgr   - "OpenDeploy routemgr"    /var/lib/opendeploy/routemgr   -
u od-egressd    - "OpenDeploy egressd"     /var/lib/opendeploy/egressd    -
u od-relay-agent - "OpenDeploy relay agent" /var/lib/opendeploy/relay-agent -
u od-caddy      - "OpenDeploy edge (Caddy)" /var/lib/opendeploy/caddy     -
u od-buildkit   - "OpenDeploy BuildKit"    /var/lib/opendeploy/buildkit   -
m od-platformd od-ipc
m od-auditd od-ipc
m od-secretd od-ipc
m od-artifactd od-ipc
m od-builderd od-ipc
m od-runtimed od-ipc
m od-routemgr od-ipc
m od-egressd od-ipc
m od-relay-agent od-ipc
m od-platformd od-backup
m od-auditd od-backup
m od-secretd od-backup
m od-artifactd od-backup
m od-runtimed od-backup
m od-builderd od-handoff
m od-artifactd od-handoff
m od-platformd od-sources
m od-builderd od-sources
m od-routemgr od-caddy
m od-caddy od-caddy
m od-builderd od-buildkit
