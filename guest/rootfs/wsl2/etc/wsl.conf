# OpenDeploy managed distribution. Windows integration is disabled so
# workloads cannot reach the host through WSL (no drive mounts, no interop,
# no Windows PATH): the node talks to Windows only through forwarded
# loopback ports.
[boot]
systemd=true

[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[network]
hostname=opendeploy
generateHosts=true
generateResolvConf=true

[user]
default=root
